<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Novale: an idea notebook that makes ideas rest before you start them. Write it down, let it rest, grow what holds.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Novale">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Novale</title>
<style>
/* Layout : application d'un seul écran. En-tête, saisie sur une ligne, onglets par étape du cycle et filtres ; en dessous, la liste à gauche et la fiche (ou « Aujourd'hui ») à droite. Sur téléphone, la fiche s'ouvre en plein écran. Seules la liste et la fiche défilent. */
:root{
  --bg:#FFFFFF; --ink:#0B0B0B; --muted:#6A6663; --hair:#E4E1DE; --line:#CFCBC7; --fill:#E9E6E3; --soft:#F5F4F2; --red:#E2231A; --red-ink:#C21C14;
  --f:"Helvetica Neue","Helvetica","Inter Tight","Arial",sans-serif;
  --s1:12px; --s2:15px; --s3:17px; --s4:22px; --s5:28px;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{color:var(--ink);font-family:var(--f);font-size:var(--s2);line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;margin:0;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.lab{font-size:var(--s1);font-weight:600;letter-spacing:.07em;text-transform:uppercase}
h1,h2,h3{margin:0;line-height:1.05;text-wrap:balance;letter-spacing:-.01em}
.inner{width:100%;max-width:1360px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.band{flex:none}

/* Marqueurs du cycle */
.mk{display:inline-block;width:10px;height:10px;flex-shrink:0}
.mk-j{border:1.5px solid var(--red)}
.mk-due{background:var(--red)}
.mk-p{border:1.5px solid var(--red);background:linear-gradient(var(--red),var(--red)) center/4px 4px no-repeat}
.mk-c{background:var(--fill);border:1px solid var(--muted);box-shadow:inset 0 -2px 0 var(--muted)}
.mk-r{background:var(--ink)}
.mk-x{border:1px solid var(--muted);background:linear-gradient(to top right,transparent calc(50% - .7px),var(--muted) calc(50% - .7px),var(--muted) calc(50% + .7px),transparent calc(50% + .7px))}
.mk-f{border:1px dashed var(--line)}

/* En-tête */
.top{border-bottom:1px solid var(--line);position:relative;z-index:30}
.top .inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.brand h1{font-size:var(--s5);font-weight:800;letter-spacing:-.03em;white-space:nowrap;flex-shrink:0}
.logo{all:unset;cursor:pointer}
.logo:focus-visible{outline:2px solid var(--red);outline-offset:4px}
.brand p{margin:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;align-items:center;gap:16px;flex-shrink:0}
.logo{display:inline-flex;align-items:center;gap:12px}
.mark{display:inline-flex;gap:3px;align-items:center}
.slots{display:flex;align-items:center;gap:8px}
.box{width:14px;height:14px;border:1px solid var(--line);background:var(--bg);display:inline-block}
.box.on{background:var(--fill);border-color:var(--muted);box-shadow:inset 0 -3px 0 var(--muted)}
.box.fallow{border:1.5px solid var(--red);margin-left:4px}
.box.off{border-style:dashed}
.slots .lbl{font-size:var(--s1);font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.optbtn{min-height:40px;padding:0 14px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.optbtn[aria-expanded="true"]{background:var(--fill)}
.optbtn svg{width:16px;height:16px}

/* Options */
.options{position:absolute;top:100%;right:var(--gr);width:min(760px,calc(100% - 32px));background:var(--bg);border:1px solid var(--line);box-shadow:0 18px 40px -24px rgba(0,0,0,.35);display:grid;grid-template-columns:1fr 1fr;z-index:40}
.opt{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-top:1px solid var(--hair);border-left:1px solid var(--hair);min-width:0}
.opt:nth-child(-n+2){border-top:0}.opt:nth-child(odd){border-left:0}
.opt p{margin:0;color:var(--muted);font-size:14px}
.opt .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.opt select{min-height:38px;border:1px solid var(--line);background:var(--bg);padding:0 8px;border-radius:0}
.opt .set{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:14px}
.status{font-size:13px;color:var(--muted)}
@media (max-width:560px){.options{grid-template-columns:1fr;right:16px;left:16px;width:auto;max-height:calc(100dvh - 90px);overflow:auto}.opt{border-left:0!important;border-top:1px solid var(--hair)!important}.opt:first-child{border-top:0!important}.brand p,.slots .lbl{display:none}}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;white-space:nowrap;border-radius:0}
.btn:hover{background:var(--soft)}
.btn.primary{border-color:var(--ink);font-weight:700}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px;padding:0 4px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:0 12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px;border-radius:0;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fill);border-color:var(--ink)}
.chip .c{color:var(--muted);font-size:13px}

/* Saisie */
.capture{display:flex;align-items:center;gap:12px 20px;padding-block:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.capture input{flex:1 1 320px;min-width:0;border:0;background:transparent;font-size:var(--s4);font-weight:500;letter-spacing:-.01em;padding:6px 0;outline-offset:6px}
.capture input::placeholder,#sowText::placeholder{color:#7A7572}
.capture .go{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.capture .short{display:none}
@media (max-width:640px){.capture{padding-block:10px;gap:8px}.capture .go{width:100%;justify-content:space-between;flex-wrap:nowrap;gap:10px}.capture input{flex-basis:100%}.capture .elab,.capture .long{display:none}.capture .short{display:inline}}
.envie{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:4px;align-items:center}
.dot{width:30px;height:30px;border:1px solid var(--line);background:var(--bg);cursor:pointer;padding:0;border-radius:0}
.dot[aria-pressed="true"]{background:var(--fill)}
.dot.pick{background:var(--red);border-color:var(--red)}
.dot:hover{border-color:var(--red)}
.elab{font-size:13px;color:var(--muted);min-width:6.8em;margin-left:4px}

/* Alertes */
.alerts .inner{display:flex;gap:8px;flex-wrap:wrap;padding-block:10px 0}
.alert{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px;font-weight:600}
.alert:hover{background:var(--soft)}

/* Onglets et filtres */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;border:0;background:transparent;padding:14px 0 12px;cursor:pointer;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tab .n{font-weight:500}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.filters{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:6px;flex-wrap:wrap}
.filters:empty{display:none}
.fls{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.fls::-webkit-scrollbar{display:none}
.fl{border:0;border-bottom:2px solid transparent;background:none;min-height:36px;padding:0;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.fl .c{font-weight:500}
.fl[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.fl:hover{color:var(--ink)}
.plot{display:flex;align-items:center;gap:16px;width:100%;min-height:112px;margin-top:12px;padding:20px;border:1px dashed var(--line);background:transparent;text-align:left;color:var(--muted);font-size:14px;line-height:1.4}
button.plot{cursor:pointer}
button.plot:hover,button.plot:focus-visible{border-color:var(--ink);color:var(--ink)}
.plot .plus{flex:none;width:40px;height:40px;border:1px solid var(--line);display:grid;place-items:center;font-size:24px;line-height:1;color:var(--ink)}
button.plot:hover .plus{border-color:var(--ink)}
.plot b{display:block;color:var(--ink);font-weight:600;font-size:var(--s2);margin-bottom:2px}
.plot.slot{min-height:64px;padding:14px 16px}
.plot.slot .plus{width:14px;height:14px;border-style:dashed;font-size:0}
.filters .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}
.filters .chips::-webkit-scrollbar{display:none}
.search{flex:0 1 240px;min-width:140px;min-height:36px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 2px;border-radius:0}

/* Deux volets */
.panes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,46%,540px)}
.list{overflow:auto;min-height:0;padding-right:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.list.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;align-content:start}
.list>.empty,.list>.chrono{grid-column:1/-1}
.detail{overflow:auto;min-height:0;border-left:1px solid var(--line);padding-left:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.bnav{display:none}
@media (max-width:759px),(max-height:520px){
  .panes{grid-template-columns:minmax(0,1fr)}
  .list{padding-right:0;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}.list.cols2{display:block}
  .detail{position:fixed;inset:0;z-index:50;background:var(--bg);border-left:0;padding:0 var(--gr) calc(24px + env(safe-area-inset-bottom,0px)) var(--gl);display:none}
  .detail.open{display:block;animation:up .18s ease-out}
  #capture,.alerts,.tabsband .tabs{display:none!important}
  .brand p,.slots .lbl,.optbtn .optlbl{display:none}
  .top .inner{padding-block:8px}
  .optbtn{width:44px;min-height:44px;padding:0;justify-content:center}
  .filters{padding-block:8px}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--line);padding:4px var(--gr) calc(4px + env(safe-area-inset-bottom,0px)) var(--gl)}
  .bnav button{border:0;background:transparent;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);cursor:pointer;position:relative;padding:0 2px}
  .bnav button[aria-selected="true"]{color:var(--ink)}
  .bnav button[aria-selected="true"]::after{content:"";position:absolute;top:-5px;left:22%;right:22%;height:2px;background:var(--ink)}
  .bnav .n{font-weight:500}
  .bnav .ic{position:relative;display:inline-flex}
  .bnav .badge{position:absolute;top:-5px;right:-7px;width:7px;height:7px;background:var(--red)}
  .bnav .sow span.plus{width:40px;height:40px;border:1px solid var(--ink);display:grid;place-items:center;font-size:24px;font-weight:400;line-height:1;color:var(--ink)}
  .bnav .sow{color:var(--ink)}
}
@media (max-height:520px){.bnav button{min-height:46px;flex-direction:row;gap:6px}.bnav .sow span.plus{width:32px;height:32px;font-size:20px}}
@media (pointer:coarse){
  .dot{width:44px;height:44px}
  .chip,.alert,.btn.small,.fl{min-height:44px}
  .close{width:44px;height:44px}
  .logo{min-height:44px}
  .subtabs .tab{min-height:44px}
}
.sheetdlg{margin:auto auto 0;width:100%;max-width:560px;border:0;border-top:1px solid var(--line)}
@media (min-width:760px) and (min-height:521px){.sheetdlg{margin:auto;border:1px solid var(--line)}}
.sheetdlg .wrap{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#sowText{width:100%;border:0;border-bottom:1px solid var(--line);font-size:var(--s4);font-weight:500;line-height:1.3;padding:8px 0;resize:none;background:transparent}
#sowText:focus{outline:none;border-bottom-color:var(--ink)}
.echoices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.echoices button{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;text-align:left}
.echoices button i{width:14px;height:14px;border:1px solid var(--line);flex-shrink:0}
.echoices button[aria-pressed="true"]{border-color:var(--ink)}
.echoices button[aria-pressed="true"] i{background:var(--red);border-color:var(--red)}
.opt.about{grid-column:1/-1;border-left:0!important;border-top:1px solid var(--hair)!important}
.wipe .warn{color:var(--red-ink);font-weight:600}
.wipe input{min-height:44px;border:1px solid var(--line);padding:0 10px;max-width:260px;font-weight:600;letter-spacing:.06em}
.wipe input:focus{outline:2px solid var(--red);outline-offset:1px}
.btn.danger-btn{border-color:var(--red-ink);color:var(--red-ink)}
.btn.danger-btn[disabled]{opacity:.35}
.today .dhead{margin-bottom:-12px}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.empty{padding:28px 0;color:var(--muted);max-width:44ch}

/* Lignes */
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;text-align:left;border:0;border-top:1px solid var(--hair);background:transparent;cursor:pointer;padding:12px 6px 13px 0;color:var(--ink);width:100%;transition:background .12s}
.card:hover{background:var(--soft)}
.card[aria-current="true"]{background:var(--soft);box-shadow:inset 3px 0 0 var(--ink);padding-left:10px}
.card .k{grid-column:1;font-size:var(--s1);font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.card .k.red{color:var(--red-ink)}
.card .big{grid-column:2;grid-row:1/span 3;font-size:24px;font-weight:700;line-height:1;letter-spacing:-.03em;text-align:right;align-self:start}
.card .big small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.card h3{grid-column:1;font-size:var(--s3);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.card p{grid-column:1;margin:0;color:var(--muted);font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .foot{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--muted)}
.card .foot .late{color:var(--red-ink);font-weight:600}
.free{display:flex;align-items:center;gap:10px;border-top:1px solid var(--hair);padding:16px 0;color:var(--muted)}
.free .box{border-style:dashed}
.bar{height:3px;background:var(--hair);position:relative;flex:1;max-width:110px}
.bar b{position:absolute;inset:0 auto 0 0;background:var(--muted)}
.mini{display:flex;gap:2px}
.mini i{width:7px;height:7px;border:1px solid var(--line)}
.mini i.on{background:var(--muted);border-color:var(--muted)}

/* Chronologie */
.chrono{display:flex;flex-direction:column;gap:22px}
.chrono h2{font-size:var(--s1);font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding-top:4px;margin-bottom:2px;display:flex;justify-content:space-between}
.ev{display:grid;grid-template-columns:64px 168px minmax(0,1fr);gap:2px 14px;align-items:baseline;border:0;border-top:1px solid var(--hair);padding:9px 0;width:100%;background:transparent;text-align:left;cursor:pointer;color:var(--ink)}
.ev:hover{background:var(--soft)}
.ev .d{color:var(--muted)}
.ev .s{display:flex;align-items:center;gap:8px;font-size:var(--s1);font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.ev .t{font-weight:600;overflow-wrap:anywhere}
@media (max-width:560px){.ev{grid-template-columns:56px minmax(0,1fr)}.ev .t{grid-column:2}}

/* Aujourd'hui */
.today{display:flex;flex-direction:column;gap:24px;padding-top:16px}
.today h2{font-size:var(--s4);font-weight:700}
.today section{display:flex;flex-direction:column}
.today .lab{margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink)}
.stat{padding:10px 10px 4px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--hair)}
.stat:first-child{padding-left:0}.stat:last-child{border-right:0}
.stat b{font-size:var(--s5);font-weight:700;letter-spacing:-.03em;line-height:1}
.stat span{display:flex;align-items:center;gap:6px;font-size:var(--s1);font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.legend{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.legend div{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--hair)}
.legend b{display:block}
.legend p{margin:0;color:var(--muted);font-size:14px}

/* Fiche */
.dhead{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;z-index:2}
@media (min-width:961px){.dhead{padding-top:12px}}
.close{width:40px;height:40px;border:0;background:transparent;font-size:28px;line-height:1;cursor:pointer}
.close:hover{background:var(--soft)}
.pill{font-size:var(--s1);font-weight:700;letter-spacing:.07em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px}
.sheet{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lab2{font-weight:700}
.field .hint{font-size:13px;color:var(--muted);margin:0}
.field input[type=text],.field input[type=date],.field textarea{width:100%;border:0;border-bottom:1px solid var(--hair);background:transparent;padding:6px 0;line-height:1.45;border-radius:0}
.field input:focus,.field textarea:focus{border-bottom-color:var(--ink);outline:none}
.field textarea{resize:vertical;min-height:48px}
.field.title input{font-size:var(--s4);font-weight:700;letter-spacing:-.02em;border-bottom:0;line-height:1.15;padding:0}
.field.idea textarea{min-height:44px;color:var(--muted)}
.next{display:flex;flex-direction:column;gap:12px;padding:14px 0 4px;border-top:1px solid var(--ink)}
.next .feedback{margin:0}
.steps{display:flex;list-style:none;margin:0;padding:0}
.steps li{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:relative;min-width:0}
.steps li::before{content:"";width:12px;height:12px;border:1px solid var(--line);background:var(--bg);position:relative;z-index:1}
.steps li::after{content:"";position:absolute;top:6px;left:12px;right:0;height:1px;background:var(--hair)}
.steps li:last-child::after{display:none}
.steps li.done::before{background:var(--fill);border-color:var(--muted)}
.steps li.done::after{background:var(--muted)}
.steps li.cur{color:var(--ink)}
.steps li.cur::before{border:2px solid var(--red)}
.steps li.x::before{background:linear-gradient(to top right,transparent calc(50% - .7px),var(--muted) calc(50% - .7px),var(--muted) calc(50% + .7px),transparent calc(50% + .7px));border-color:var(--muted)}
.nextrow{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.nextrow p{margin:0;flex:1 1 220px}
.subtabs{display:flex;gap:20px;border-bottom:1px solid var(--line);position:sticky;top:calc(60px + env(safe-area-inset-top,0px));background:var(--bg);z-index:1}
@media (min-width:961px){.subtabs{top:62px}}
.subtabs .tab{padding:10px 0 9px;font-size:14px}
.pane{display:flex;flex-direction:column;gap:18px;padding-top:4px}
.tl{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:40px;position:relative}
.tl li::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--hair)}
.tl li:first-child::before{top:50%}
.tl li:last-child::before{bottom:50%}
.tl .mk{position:relative;z-index:1}
.tl .mk-j,.tl .mk-f,.tl .mk-p,.tl .mk-x{background-color:var(--bg)}
.tl .lbl{font-weight:600}
.tl li.future .lbl{color:var(--muted);font-weight:400}
.tl input[type=date]{border:0;border-bottom:1px solid transparent;background:transparent;padding:4px 0;text-align:right;min-width:9.5em}
.tl input[type=date]:hover{border-bottom-color:var(--line)}
.tl input[type=date]:focus{border-bottom-color:var(--ink);outline:none}
.tl .nodate{color:var(--line);text-align:right}
.durs{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);padding-top:8px;border-top:1px solid var(--hair)}
.durs b{color:var(--ink);font-weight:600}
.block{display:flex;flex-direction:column;gap:12px;padding:14px 0;border-top:1px solid var(--ink)}
.block h3{font-size:var(--s3);font-weight:700}
.block p{margin:0}
.block.due{border-top-color:var(--red)}
.q{display:flex;flex-direction:column;gap:16px}
.q .ess::after{content:attr(data-ess);margin-left:8px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--red-ink)}
.recul{display:flex;flex-direction:column;gap:8px;padding:14px 16px;background:var(--soft)}
.recul .qq{font-size:var(--s3);font-weight:700;line-height:1.25}
.recul textarea{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 0;resize:vertical}
.jl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.jl li{display:grid;grid-template-columns:62px 1fr;gap:8px}
.jl .d{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.danger{color:var(--red-ink)}
.inline-form{display:flex;flex-direction:column;gap:12px;padding:14px 16px;background:var(--soft)}
dialog{border:1px solid var(--line);padding:0;width:min(560px,calc(100% - 32px));max-height:calc(100% - 32px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(11,11,11,.3)}
dialog .wrap{padding:0 20px 20px;display:flex;flex-direction:column;gap:14px}
dialog .dhead{border-bottom:1px solid var(--line)}
.copybox textarea{width:100%;min-height:240px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;border:1px solid var(--line);padding:8px;background:var(--bg);border-radius:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bg);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 24px -12px rgba(0,0,0,.3);padding:12px 18px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<header class="top band">
  <div class="inner">
    <div class="brand"><h1><button type="button" class="logo" id="logoBtn"><span>Novale</span><span class="mark" id="mark" aria-hidden="true"></span></button></h1><p data-i="tagline"></p></div>
    <div class="right">
      <div class="slots" id="slots" aria-live="polite"><span class="lbl" id="slotsLbl"></span></div>
      <button class="optbtn" type="button" id="optBtn" aria-expanded="false" aria-controls="options"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 4h14M1 12h14" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="2" width="3" height="4" fill="currentColor"/><rect x="9" y="10" width="3" height="4" fill="currentColor"/></svg><span class="optlbl" data-i="options"></span></button>
    </div>
  </div>
  <section class="options" id="options" hidden>
    <div class="opt">
      <span class="lab" data-i="settings"></span>
      <div class="set">
        <label for="setLang" data-i="lang"></label>
        <select id="setLang"><option value="fr">Français</option><option value="en">English</option></select>
        <label for="setRest" data-i="rest"></label>
        <select id="setRest"></select>
        <label for="setLimit" data-i="slotsSet"></label>
        <select id="setLimit"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
      </div>
      <p class="status" id="storeStatus"></p>
    </div>
    <div class="opt">
      <span class="lab" data-i="toObs"></span>
      <p data-i="toObsP"></p>
      <div class="acts"><button class="btn small" type="button" id="zipBtn" hidden data-i="zip"></button><button class="btn small" type="button" id="copyAllBtn" data-i="copyAll"></button></div>
    </div>
    <div class="opt">
      <span class="lab" data-i="fromObs"></span>
      <p data-i="fromObsP"></p>
      <div class="acts"><label class="btn small" for="importFile" data-i="openMd"></label><input type="file" id="importFile" accept=".md,.markdown,text/markdown,text/plain" multiple class="sr"><button class="btn small" type="button" id="pasteBtn" data-i="paste"></button></div>
    </div>
    <div class="opt">
      <span class="lab" data-i="paper"></span>
      <p data-i="paperP"></p>
      <div class="acts"><button class="btn small" type="button" id="blankBtn" data-i="blank"></button></div>
    </div>
    <div class="opt about" id="installBox" hidden></div>
    <div class="opt about wipe" id="wipeBox"></div>
    <div class="opt about">
      <span class="lab" data-i="about"></span>
      <p id="aboutP"></p>
    </div>
  </section>
</header>

<form class="band" id="capture" autocomplete="off">
  <div class="inner capture">
    <label for="capText" class="sr" data-i="capLbl"></label>
    <input type="text" id="capText" data-ph="capPh" enterkeyhint="done">
    <div class="go">
      <div class="envie" role="group" aria-labelledby="capEnvieLbl"><span id="capEnvieLbl" class="lab" data-i="desire"></span><div class="dots" id="capDots"></div></div>
      <button class="btn primary" type="submit"><span class="long" data-i="sowLong"></span><span class="short" data-i="sowShort"></span></button>
    </div>
  </div>
</form>

<div class="band alerts" id="alerts" hidden><div class="inner" id="alertsIn"></div></div>

<div class="band tabsband">
  <div class="inner">
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="filters" id="filters"></div>
  </div>
</div>

<div class="panes inner">
  <div class="list" id="list" role="tabpanel"></div>
  <aside class="detail" id="detail"></aside>
</div>

<nav class="bnav" id="bnav" role="tablist"></nav>

<dialog id="aux"><div class="wrap" id="auxBody"></div></dialog>
<dialog id="sowDlg" class="sheetdlg" aria-labelledby="sowH"><form class="wrap" id="sowForm" autocomplete="off">
  <div class="dhead"><span class="pill" id="sowH"><span class="mk mk-j"></span><span data-i="newIdea"></span></span><button class="close" type="button" data-x data-i-aria="close">×</button></div>
  <label for="sowText" class="sr" data-i="capLbl"></label>
  <textarea id="sowText" rows="2" data-ph="capPh" enterkeyhint="done"></textarea>
  <span class="lab" data-i="desire"></span>
  <div class="echoices" id="sowChoices" role="group"></div>
  <button class="btn primary" type="submit" data-i="sowLong"></button>
</form></dialog>
<div class="toast" id="toast" role="status" hidden></div>

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let LANG=(()=>{const s=lsGet("novale.lang");if(s==="fr"||s==="en")return s;return /^fr/i.test(navigator.language||"")?"fr":"en"})();
const t=(k,...a)=>{const v=I18N[LANG][k]??I18N.fr[k];return typeof v==="function"?v(...a):v};
const Q=q=>q[LANG]||q.fr;
const ENVIE=()=>t("envie");
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const isD=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||""));
const parseD=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parseD(s);d.setMonth(d.getMonth()+n);return iso(d)};
const diff=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const fr=s=>isD(s)?parseD(s).toLocaleDateString(t("locale"),{day:"numeric",month:"short"}):"";
const frLong=s=>isD(s)?parseD(s).toLocaleDateString(t("locale"),{day:"numeric",month:"long",year:"numeric"}):"";
const monthName=s=>{const x=parseD(s).toLocaleDateString(t("locale"),{month:"long",year:"numeric"});return x.charAt(0).toUpperCase()+x.slice(1)};
const jours=n=>t("day",n);
const uid=()=>"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clampE=v=>{const n=Math.round(+v);return n>0?Math.min(4,n):0};
const titleFrom=x=>{x=String(x||"").trim().replace(/\s+/g," ");if(x.length<=60)return x.replace(/[.!?]$/,"");const c=x.slice(0,60);return c.slice(0,c.lastIndexOf(" ")>30?c.lastIndexOf(" "):60)+"…"};
const fileName=x=>(String(x||"Idea").replace(/[\\/:*?"<>|#^\[\]]/g,"").replace(/\s+/g," ").trim().slice(0,90)||"Idea");
let toastT;
function toast(msg){const el=$("#toast");el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2800)}

/* ---------- Modèle ---------- */
function normalize(raw){
  if(!raw)return raw;
  const o={...raw};const d={...(o.dates||{})};
  const jd=re=>{const j=(o.journal||[]).find(x=>re.test(x.t));return j?j.d:""};
  d.semee=isD(d.semee)?d.semee:(isD(o.cree)?o.cree:today());
  if(!isD(d.relire))d.relire=isD(o.relire)?o.relire:"";
  ["relue","cultivee","prevue","recoltee","compostee"].forEach(k=>{if(!isD(d[k]))d[k]=""});
  if(IMPORT_STATUS[o.statut])o.statut=IMPORT_STATUS[o.statut];
  switch(o.statut){
    case "mure":o.statut="jachere";d.relue=d.relue||jd(/^Relue/)||today();break;
    case "active":o.statut="cultivee";d.relue=d.relue||jd(/^Relue/);d.cultivee=d.cultivee||jd(/^Démarrée/)||today();break;
    case "terminee":case "transmise":
      d.cultivee=d.cultivee||jd(/^Démarrée/);d.recoltee=d.recoltee||(isD(o.issue?.d)?o.issue.d:today());o.bilan=o.bilan||o.issue?.note||"";
      if(o.statut==="transmise")o.transmiseA=o.transmiseA||o.issue?.a||"";o.statut="recoltee";break;
    case "cultivee":d.cultivee=d.cultivee||today();break;
    case "recoltee":d.recoltee=d.recoltee||today();break;
    case "compostee":d.compostee=d.compostee||(isD(o.issue?.d)?o.issue.d:today());o.bilan=o.bilan||o.issue?.note||"";break;
    default:o.statut="jachere";
  }
  if(o.statut==="jachere"&&!d.relue&&!d.relire)d.relire=addDays(d.semee,Store.prefs.rest);
  o.dates=d;delete o.cree;delete o.relire;delete o.issue;
  o.envie=clampE(o.envie)||3;o.envieRelue=o.envieRelue?clampE(o.envieRelue)||null:null;
  o.q=o.q||{};o.reflexions=o.reflexions||[];o.liens=o.liens||[];o.tags=o.tags||[];o.journal=o.journal||[];
  o.bilan=o.bilan||"";o.transmiseA=o.transmiseA||"";o.titre=o.titre||titleFrom(o.idee)||t("untitled");o.kind="idee";o.v=2;
  return o;
}
const stage=i=>{if(i.statut!=="jachere")return i.statut;if(i.dates.relue)return "prete";return i.dates.relire&&diff(i.dates.relire,today())>=0?"due":"repos"};
const isDue=i=>stage(i)==="due";
const cultivees=()=>Store.all().filter(i=>i.statut==="cultivee");
const ripeness=i=>QUESTIONS.filter(q=>q.ess&&(i.q[q.k]||"").trim()).length;
const log=(i,x)=>{i.journal.push({d:today(),t:x})};
const endDate=i=>i.dates.recoltee||i.dates.compostee||"";
function durations(i){
  const d=i.dates,end=endDate(i)||today(),out=[];
  if(d.relue)out.push([t("d_rest"),diff(d.semee,d.relue)]);
  else if(i.statut==="jachere")out.push([t("d_rest"),diff(d.semee,today())]);
  if(d.cultivee)out.push([t("d_grow"),diff(d.cultivee,end)]);
  out.push([endDate(i)?t("d_full"):t("d_since"),diff(d.semee,end)]);
  return out;
}
function newIdea(text,envie){
  const n=today();
  const i=normalize({id:uid(),titre:titleFrom(text),idee:text.trim(),envie,statut:"jachere",dates:{semee:n,relire:addDays(n,Store.prefs.rest)}});
  log(i,t("l_sown",ENVIE()[i.envie]));return i;
}

const LSKEY="novale.v1",LSOLD="jachere.v1";
const Store={
  mode:"local",items:new Map(),prefs:{rest:7,limit:3},col:null,timers:{},dirty:new Set(),ready:false,
  clamp(){this.prefs.limit=Math.min(3,Math.max(1,Math.round(+this.prefs.limit)||3))},
  loadLocal(){try{const raw=JSON.parse(lsGet(LSKEY)||lsGet(LSOLD)||"{}");if(raw.prefs)Object.assign(this.prefs,raw.prefs);this.clamp();(raw.items||[]).forEach(i=>{const n=normalize(i);this.items.set(n.id,n)})}catch(e){}},
  saveLocal(){lsSet(LSKEY,JSON.stringify({items:[...this.items.values()],prefs:this.prefs}))},
  async init(){
    this.loadLocal();
    let db=null,user=null,id=null;
    try{if(!STANDALONE){[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(user)id=await user.id()}}catch(e){db=null}
    if(db&&id){
      this.col=db.collection("data/users/"+id);this.mode="db";
      const localItems=[...this.items.values()];this.items=new Map();let first=true;
      this.col.onSnapshot(snap=>{
        const next=new Map();
        snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==="prefs"){Object.assign(this.prefs,v);this.clamp();return}if(v.kind==="idee")next.set(d.id,normalize({...v,id:d.id}))});
        this.dirty.forEach(k=>{if(this.items.has(k))next.set(k,this.items.get(k))});
        this.items=next;
        if(first){first=false;if(next.size===0&&localItems.length)UI.offerMigrate(localItems)}
        this.ready=true;UI.render();if(UI.openId&&!UI.typing())UI.renderSheet(true);
      },err=>{this.status=t("st_dbErr",err.code);this.mode="local";this.loadLocal();UI.render()});
      this.status="st_db";
    }else{this.ready=true;this.status="st_local";UI.render()}
    UI.renderStatus();
  },
  all(){return [...this.items.values()]},
  get(id){return this.items.get(id)},
  put(item,{now=false}={}){
    item.kind="idee";item.v=2;item.maj=Date.now();this.items.set(item.id,item);
    if(this.mode==="db"){
      this.dirty.add(item.id);clearTimeout(this.timers[item.id]);
      const go=()=>{const clean=JSON.parse(JSON.stringify(item));delete clean._er;this.col.doc(item.id).set(clean).then(()=>this.dirty.delete(item.id)).catch(e=>{this.dirty.delete(item.id);toast(t("t_notSaved",e&&e.code==="quota_exceeded"))})};
      now?go():this.timers[item.id]=setTimeout(go,700);
    }else this.saveLocal();
  },
  removeAll(){[...this.items.keys()].forEach(id=>this.remove(id));this.saveLocal&&this.mode!=="db"&&this.saveLocal()},
  remove(id){this.items.delete(id);if(this.mode==="db"){clearTimeout(this.timers[id]);this.dirty.delete(id);this.col.doc(id).delete().catch(()=>toast(t("t_delFail")))}else this.saveLocal()},
  setPrefs(p){Object.assign(this.prefs,p);if(this.mode==="db")this.col.doc("prefs").set({...this.prefs,kind:"prefs"}).catch(()=>{});else this.saveLocal()}
};

/* ---------- Markdown (Obsidian) ---------- */
const yq=v=>{v=String(v??"");return /^[\w\- àâäçéèêëîïôöùûüÿœæÀ-ÿ'.]*$/.test(v)&&v.trim()===v&&!/^(true|false|null|yes|no|\d)/i.test(v)?v:JSON.stringify(v)};
function toMd(i){
  const titles=new Map(Store.all().map(x=>[x.id,x.titre]));const d=i.dates;
  const fm=["---","id: "+i.id,"type: idea","status: "+EXPORT_STATUS[i.statut],"desire: "+i.envie,"desire_review: "+(i.envieRelue??""),
    "added: "+d.semee,"review: "+(i.statut==="jachere"&&!d.relue?d.relire:""),"reviewed: "+d.relue,"growing: "+d.cultivee,"harvest_due: "+d.prevue,"harvested: "+d.recoltee,"composted: "+d.compostee];
  if(i.transmiseA)fm.push("handed_to: "+yq(i.transmiseA));
  fm.push("tags:","  - idea","  - "+EXPORT_STATUS[i.statut]);
  i.tags.forEach(x=>fm.push("  - "+x.replace(/\s+/g,"-")));
  fm.push("---","");
  const out=[...fm,"# "+i.titre,"","> "+String(i.idee||"").replace(/\n/g,"\n> "),""];
  QUESTIONS.forEach(q=>out.push("## "+Q(q)[0],"",(i.q[q.k]||"").trim(),""));
  if(i.reflexions.length){out.push("## "+t("md_refl"),"");i.reflexions.forEach(r=>out.push("- **"+r.q+"** "+r.r.replace(/\n/g," ")+" ("+r.d+")"));out.push("")}
  if(i.bilan||i.transmiseA)out.push("## "+t("md_out"),"",(i.transmiseA?t("md_handed",i.transmiseA):"")+i.bilan,"");
  out.push("## "+t("md_links"),"");i.liens.filter(l=>titles.has(l)).forEach(l=>out.push("- [["+fileName(titles.get(l))+"]]"));out.push("");
  out.push("## "+t("md_log"),"");i.journal.forEach(j=>out.push("- "+j.d+" · "+j.t));out.push("");
  return out.join("\n").replace(/\n{3,}/g,"\n\n");
}
function unq(v){v=String(v).trim();if(/^".*"$/.test(v)){try{return JSON.parse(v)}catch(e){}}if(/^'.*'$/.test(v))return v.slice(1,-1);return v}
function norm(s){return String(s).toLowerCase().replace(/[«»“”"'’ ?]/g,"").normalize("NFD").replace(/[̀-ͯ]/g,"")}
const anySec=(secs,names)=>{const k=Object.keys(secs).find(s=>names.some(n=>norm(n)===norm(s)));return k?secs[k].join("\n").trim():""};
const anyLines=(secs,names)=>{const k=Object.keys(secs).find(s=>names.some(n=>norm(n)===norm(s)));return k?secs[k]:[]};
function fromMd(text){
  text=String(text).replace(/\r\n?/g,"\n").replace(/^\s*<!--[^\n]*-->\s*\n/,"").trim()+"\n";
  const fm={};let body=text;const m=text.match(/^---\n([\s\S]*?)\n---\n?/);
  if(m){body=text.slice(m[0].length);let lastKey=null;
    m[1].split("\n").forEach(line=>{const li=line.match(/^\s+-\s+(.*)$/);if(li&&lastKey){(fm[lastKey]=Array.isArray(fm[lastKey])?fm[lastKey]:[]).push(unq(li[1]));return}
      const kv=line.match(/^([\w\-éèà]+):\s*(.*)$/);if(kv){lastKey=kv[1];fm[kv[1]]=kv[2]===""?"":unq(kv[2])}})}
  let titre="",idee=[],sec=null;const secs={};
  body.split("\n").forEach(l=>{
    if(!titre&&/^#\s+/.test(l)){titre=l.replace(/^#\s+/,"").trim();return}
    const h=l.match(/^##\s+(.*)$/);if(h){sec=h[1].trim();secs[sec]=[];return}
    if(sec===null){if(/^>\s?/.test(l))idee.push(l.replace(/^>\s?/,""));else if(l.trim()&&titre&&!idee.length)idee.push(l);return}
    secs[sec].push(l);
  });
  const q={};QUESTIONS.forEach(x=>{const names=[x.fr[0],x.en[0]];if(x.k==="fini")names.push("À quoi ressemble « fini » ?");const v=anySec(secs,names);if(v)q[x.k]=v});
  const journal=anyLines(secs,["Journal","Log"]).map(l=>l.match(/^-\s+(\d{4}-\d{2}-\d{2})\s+·\s+(.*)$/)).filter(Boolean).map(x=>({d:x[1],t:x[2]}));
  const reflexions=anyLines(secs,["Réflexions","Reflections"]).map(l=>l.match(/^-\s+\*\*(.+?)\*\*\s+(.*?)(?:\s+\((\d{4}-\d{2}-\d{2})\))?$/)).filter(Boolean).map(x=>({q:x[1],r:x[2],d:x[3]||today()}));
  const linkTitles=anyLines(secs,["Liens","Links"]).map(l=>(l.match(/\[\[([^\]|#]+)/)||[])[1]).filter(Boolean);
  const skip=["idea","idee","idée","jachere","mure","active","terminee","transmise",...STATUTS,...Object.keys(IMPORT_STATUS)];
  const tags=(Array.isArray(fm.tags)?fm.tags:[]).filter(x=>!skip.includes(x));
  const handed=fm.handed_to||fm.transmise_a||"";
  let bilan=anySec(secs,["Bilan","Outcome"])||anySec(secs,["Issue"]).replace(/^[^:]*:\s*/,"");
  if(handed)bilan=bilan.replace(/^(Transmise à|Handed to) [^.]*\.\s*/,"");
  const raw={id:fm.id&&/^[\w-]+$/.test(fm.id)?fm.id:uid(),titre:titre||titleFrom(idee.join(" ")),idee:idee.join("\n").trim(),envie:fm.desire||fm.envie,envieRelue:fm.desire_review||fm.envie_relue||null,
    statut:fm.status||fm.statut||"jachere",
    dates:{semee:fm.added||fm.sown||fm.semee||fm.cree,relire:fm.review||fm.relire,relue:fm.reviewed||fm.relue,cultivee:fm.growing||fm.cultivee,prevue:fm.harvest_due||fm.recolte_prevue,recoltee:fm.harvested||fm.recoltee,compostee:fm.composted||fm.compostee},
    issue:fm.fin?{d:fm.fin,a:handed,note:bilan}:null,transmiseA:handed,bilan,q,reflexions,tags,journal};
  const n=normalize(raw);n._linkTitles=linkTitles;return n;
}
function importMany(texts){
  let added=0,updated=0;const parsed=texts.map(fromMd);
  parsed.forEach(p=>{const ex=Store.get(p.id);if(ex){p.liens=ex.liens;updated++}else added++;Store.items.set(p.id,p)});
  const byTitle=new Map(Store.all().map(x=>[fileName(x.titre).toLowerCase(),x.id]));
  parsed.forEach(p=>{const it=Store.get(p.id);if(p._linkTitles&&p._linkTitles.length)it.liens=[...new Set(p._linkTitles.map(x=>byTitle.get(x.toLowerCase())).filter(x=>x&&x!==it.id))];delete it._linkTitles;Store.put(it,{now:true})});
  UI.render();toast(t("t_import",added,updated));
}

  chronoHtml(a,f){

      if(stage(i)==="repos"&&d.relire)ev.push({d:d.relire,k:"relire",i});
      if(i.statut==="cultivee"&&d.prevue)ev.push({d:d.prevue,k:"prevue",i});
    });
    const isFut=e=>(e.k==="relire"||e.k==="prevue")&&e.d>n;
    let fut=ev.filter(isFut).sort((x,y)=>x.d.localeCompare(y.d));
    let past=ev.filter(e=>!isFut(e)).sort((x,y)=>y.d.localeCompare(x.d)||STEPRANK[y.k]-STEPRANK[x.k]);
    if(f==="avenir")past=[];
    if(f==="mois"){fut=fut.filter(e=>e.d.slice(0,7)===m);past=past.filter(e=>e.d.slice(0,7)===m)}
    let h='<div class="chrono">';
    if(fut.length)h+=`<section><h2><span>${esc(t("upcoming"))}</span><span>${fut.length}</span></h2>${fut.map(e=>this.evRow(e)).join("")}</section>`;
    const g=new Map();past.forEach(e=>{const k=e.d.slice(0,7);if(!g.has(k))g.set(k,[]);g.get(k).push(e)});
    g.forEach((list,k)=>{h+=`<section><h2><span>${esc(monthName(k+"-01"))}</span><span>${list.length}</span></h2>${list.map(e=>this.evRow(e)).join("")}</section>`});

    else{txt=t("n_end",esc(t("st_"+s)),esc(frLong(end)),esc(jours(diff(d.semee,end))));acts=btn("resow",t("n_resow"))}
    let f="";
    if(form==="early")f=`<div class="inline-form"><div class="field"><label for="fPresse">${esc(t("earlyQ"))}</label><p class="hint">${esc(t("earlyH"))}</p><textarea id="fPresse" rows="2"></textarea></div><div class="actions">${btn("earlyGo",t("earlyGo"),true)}<button class="btn small ghost" type="button" data-act="cancel">${esc(t("earlyNo"))}</button></div></div>`;
    if(form==="cultivee")f=`<div class="inline-form"><div class="field"><label for="fPrevue">${esc(t("f_due_lbl"))}</label><p class="hint">${esc(t("f_dueH"))}</p><input type="date" id="fPrevue" value=""></div><div class="chips"><button type="button" class="chip" data-prev="14">${esc(t("f_2w"))}</button><button type="button" class="chip" data-prevm="1">${esc(t("f_1m"))}</button><button type="button" class="chip" data-prevm="3">${esc(t("f_3m"))}</button></div><div class="actions">${btn("go:cultivee",t("f_growGo"),true)}<button class="btn small ghost" type="button" data-act="cancel">${esc(t("cancel"))}</button></div></div>`;
    if(form==="recoltee"||form==="compostee"){const R=form==="recoltee";
      f=`<div class="inline-form">${R?`<div class="field"><label for="fA">${esc(t("f_handed"))}</label><p class="hint">${esc(t("f_handedH"))}</p><input type="text" id="fA"></div>`:""}<div class="field"><label for="fNote">${esc(R?t("b_gave"):t("b_kept"))}</label><p class="hint">${esc(R?t("f_gaveH"):t("f_keptH"))}</p><textarea id="fNote"></textarea></div><div class="actions">${btn("go:"+form,R?t("f_harvGo"):t("f_compGo"),true)}<button class="btn small ghost" type="button" data-act="cancel">${esc(t("cancel"))}</button></div></div>`}
    return `<div class="next">${ol}<p class="feedback">${txt}</p>${extra}${f||`<div class="actions">${acts}</div>`}</div>`;
  },
  closedBlock(i){
    const s=stage(i);if(s!=="recoltee"&&s!=="compostee")return "";
    return `<div class="field"><label for="fBilan">${esc(s==="recoltee"?t("b_gave"):t("b_kept"))}</label>${i.transmiseA?`<p class="hint">${esc(t("c_handed",i.transmiseA))}</p>`:""}<textarea id="fBilan" data-f="bilan">${esc(i.bilan)}</textarea></div>`;
  },
  renderSheet(keepScroll){
    const i=Store.get(this.openId);if(!i)return;
    const el=$("#detail"),st=el.scrollTop,s=stage(i),sub=this.sub,r=ripeness(i),E=ENVIE();
    const others=Store.all().filter(x=>x.id!==i.id&&(x.statut==="jachere"||x.statut==="cultivee"));
    let h=`<div class="dhead"><span class="pill"><span class="mk ${MK[s]}"></span>${esc(i.statut==="jachere"?t("st_jachere")+" · "+t("st_"+s):t("st_"+s))}</span><button class="close" type="button" data-close aria-label="${esc(t("close"))}">×</button></div><div class="sheet">`;
    h+=`<div class="field title"><label for="fTitre" class="sr">${esc(t("title"))}</label><input type="text" id="fTitre" data-f="titre" value="${esc(i.titre)}"></div>`;
    h+=`<div class="field idea"><label for="fIdee" class="sr">${esc(t("idea"))}</label><textarea id="fIdee" data-f="idee" rows="2">${esc(i.idee)}</textarea></div>`;
    h+=`<div class="envie" role="group" aria-labelledby="fEnvLbl"><span id="fEnvLbl" class="lab">${esc(t("desire"))}</span><div class="dots">${this.dotsHtml(i.envie,"env")}</div>${i.envieRelue?`<span class="lab muted">${esc(t("desireRev",E[i.envieRelue]))}</span>`:""}</div>`;
    h+=this.nextBar(i);
    h+=`<div class="subtabs" role="tablist" aria-label="${esc(t("subAria"))}">${[["cycle",t("sub_cycle")],["questions",t("sub_q",r)],["notes",t("sub_notes")]].map(([k,l])=>`<button type="button" class="tab" role="tab" data-sub="${k}" aria-selected="${sub===k}">${esc(l)}</button>`).join("")}</div><div class="pane" role="tabpanel">`;
    if(sub==="cycle")h+=this.closedBlock(i)+this.timeline(i);
    if(sub==="questions"){
      h+='<div class="q">'+QUESTIONS.map(q=>`<div class="field"><label for="q_${q.k}"${q.ess?` class="ess" data-ess="${esc(t("ess"))}"`:""}>${esc(Q(q)[0])}</label><p class="hint">${esc(Q(q)[1])}</p><textarea id="q_${q.k}" data-q="${q.k}" rows="2">${esc(i.q[q.k]||"")}</textarea></div>`).join("")+'</div>';
      if(i.statut==="jachere"||i.statut==="cultivee"){const R=RECUL[LANG];const k=this.recul[i.id]??Math.floor(Math.random()*R.length);this.recul[i.id]=k;
        h+=`<div class="recul"><span class="lab muted">${esc(t("recul"))}</span><span class="qq" id="rq">${esc(R[k])}</span><label for="rA" class="sr">${esc(t("recul"))}</label><textarea id="rA" rows="2" placeholder="${esc(t("reculPh"))}"></textarea><div class="actions"><button class="btn small" type="button" data-act="reculSave">${esc(t("reculSave"))}</button><button class="btn small ghost" type="button" data-act="reculNext">${esc(t("reculNext"))}</button></div></div>`}
      if(i.reflexions.length)h+=`<div class="field"><span class="lab2">${esc(t("reflections"))}</span><ul class="jl">${i.reflexions.map(x=>`<li><span class="d">${esc(fr(x.d))}</span><span><b>${esc(x.q)}</b> ${esc(x.r)}</span></li>`).join("")}</ul></div>`;
      if(s==="prete"&&r===4)h+=`<div><button class="btn small primary" type="button" data-sub="cycle">${esc(t("allFour"))}</button></div>`;
    }
    if(sub==="notes"){
      h+=`<div class="field"><span class="lab2" id="lnkLbl">${esc(t("linked"))}</span><p class="hint">${esc(t("linkedH"))}</p><div class="chips" role="group" aria-labelledby="lnkLbl">${others.length?others.map(o=>`<button type="button" class="chip" data-link="${o.id}" aria-pressed="${i.liens.includes(o.id)}">${esc(o.titre)}</button>`).join(""):`<span class="muted" style="font-size:14px">${esc(t("noLinks"))}</span>`}</div></div>`;
      h+=`<div class="field"><label for="fTags">${esc(t("tags"))}</label><p class="hint">${esc(t("tagsH"))}</p><input type="text" id="fTags" data-f="tags" value="${esc(i.tags.join(", "))}"></div>`;
      h+=`<div class="actions"><button class="btn small" type="button" data-act="copyMd">${esc(t("copyMd"))}</button>${canSave()?`<button class="btn small" type="button" data-act="saveMd">${esc(t("saveMd"))}</button><button class="btn small" type="button" data-act="savePaper">${esc(t("savePaper"))}</button>`:""}</div>`;
      h+=`<div class="field"><span class="lab2">${esc(t("log"))}</span><ul class="jl">${i.journal.slice().reverse().map(j=>`<li><span class="d">${esc(fr(j.d))}</span><span>${esc(j.t)}</span></li>`).join("")}</ul></div>`;
      h+=this.showForm==="del"?`<div class="inline-form"><p style="margin:0">${t("delQ")}</p><div class="actions"><button class="btn small" type="button" data-act="delGo" style="border-color:var(--red);color:var(--red)">${esc(t("del"))}</button><button class="btn small ghost" type="button" data-act="cancel">${esc(t("keep"))}</button></div></div>`:`<div><button class="btn small ghost danger" type="button" data-act="del">${esc(t("delIdea"))}</button></div>`;
    }
    h+='</div></div>';
    el.innerHTML=h;if(keepScroll)el.scrollTop=st;
  },
  act(a){
    const i=Store.get(this.openId);if(!i)return;const d=i.dates,R=Store.prefs.rest,L=Store.prefs.limit,E=ENVIE();
    const keep=msg=>{Store.put(i,{now:true});this.render();this.renderSheet(true);if(msg)toast(msg)};
    if(a==="early"){this.showForm="early";this.renderSheet(true);setTimeout(()=>$("#fPresse")?.focus(),40);return}
    if(a==="cancel"){this.showForm=null;return this.renderSheet(true)}
    if(a==="earlyGo"){const r=$("#fPresse").value.trim();log(i,t("l_early",r));d.relire=today();this.showForm=null;keep();setTimeout(()=>$("#detail .next .dot")?.focus(),40);return}
    if(a==="ripen"){i.envieRelue=i._er;delete i._er;d.relue=today();log(i,t("l_holds",E[i.envieRelue]));this.sub="questions";Store.put(i,{now:true});this.render();this.renderSheet();$("#detail").scrollTop=0;setTimeout(()=>$("#q_probleme")?.focus(),60);return}
    if(a==="again"){d.relire=addDays(today(),R);delete i._er;log(i,t("l_again",R));return keep(t("t_reviewOn",frLong(d.relire)))}
    if(a==="rest"){const was=i.statut;i.statut="jachere";d.relue="";d.cultivee="";d.prevue="";d.relire=addDays(today(),R);log(i,was==="cultivee"?t("l_unGrow"):t("l_rest"));return keep(t("t_restUntil",frLong(d.relire)))}
    if(a.startsWith("form:")){this.showForm=a.slice(5);this.renderSheet(true);setTimeout(()=>{const el=$("#fPrevue")||$("#fA")||$("#fNote");if(el){el.scrollIntoView({block:"center"});el.focus()}},40);return}
    if(a==="go:cultivee"){if(cultivees().length>=L)return toast(t("t_full"));const p=$("#fPrevue").value;
      i.statut="cultivee";d.cultivee=today();d.prevue=isD(p)?p:"";log(i,t("l_grow",d.prevue,i.q.remplace));this.showForm=null;
      return keep(t("t_growing",cultivees().length,L))}
    if(a==="go:recoltee"||a==="go:compostee"){const k=a.slice(3),note=$("#fNote").value.trim(),to=$("#fA")?.value.trim()||"";
      delete i._er;i.statut=k;d[k]=today();i.bilan=note;if(k==="recoltee")i.transmiseA=to;
      log(i,t("l_end",t("st_"+k),to,note));this.showForm=null;return keep(t("t_done",t("st_"+k),frLong(today())))}
    if(a==="resow"){log(i,t("l_resow",d.semee,endDate(i)));i.statut="jachere";i.dates={semee:today(),relire:addDays(today(),R),relue:"",cultivee:"",prevue:"",recoltee:"",compostee:""};i.transmiseA="";return keep(t("t_resown",frLong(i.dates.relire)))}
    if(a==="reculNext"){const n=RECUL[LANG].length;this.recul[i.id]=(this.recul[i.id]+1+Math.floor(Math.random()*(n-1)))%n;$("#rq").textContent=RECUL[LANG][this.recul[i.id]];return}
    if(a==="reculSave"){const r=$("#rA").value.trim();if(!r){$("#rA").focus();return}i.reflexions.push({q:RECUL[LANG][this.recul[i.id]],r,d:today()});this.recul[i.id]=(this.recul[i.id]+1)%RECUL[LANG].length;return keep(t("t_refl"))}
    if(a==="copyMd")return copyText(toMd(i),t("t_copiedNote"));
    if(a==="saveMd")return save(fileName(i.titre)+".md",toMd(i)).then(ok=>ok&&toast(t("t_saved")));
    if(a==="savePaper")return save(t("p_file")+" - "+fileName(i.titre)+".html",ficheHtml([i])).then(ok=>ok&&toast(t("t_print")));
    if(a==="del"){this.showForm="del";return this.renderSheet(true)}
    if(a==="delGo"){Store.remove(i.id);this.openId=null;$("#detail").classList.remove("open");this.render();return toast(t("t_deleted"))}
  }
};

/* ---------- Événements ---------- */
document.addEventListener("click",e=>{
  const o=$("#options");if(!o.hidden&&!e.target.closest("#options")&&!e.target.closest("#optBtn")){o.hidden=true;$("#optBtn").setAttribute("aria-expanded","false");if(UI.wipeStep){UI.wipeStep=0;UI.renderWipe()}}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.cap){UI.capEnvie=+b.dataset.cap;UI.renderCap();return}
  if(b.id==="installBtn"&&UI.installEvt){const ev=UI.installEvt;ev.prompt();ev.userChoice.then(r=>{if(r&&r.outcome==="accepted"){UI.installEvt=null;toast(t("i_done"))}UI.renderInstall()}).catch(()=>{});return}
  if(b.dataset.wipe){
    const v=b.dataset.wipe;
    if(v==="go"){if(($("#wipeWord").value||"").trim().toUpperCase()!==t("w_word"))return;Store.removeAll();UI.openId=null;UI._migrate=null;$("#detail").classList.remove("open");UI.wipeStep=0;UI.renderWipe();UI.render();toast(t("w_done"));return}
    if(v==="1"&&!Store.all().length){toast(t("w_empty"));return}
    UI.wipeStep=+v;UI.renderWipe();if(v==="3")setTimeout(()=>$("#wipeWord")?.focus(),30);else $(`#wipeBox [data-wipe]`)?.focus();return}
  if(b.dataset.sowe){UI.capEnvie=+b.dataset.sowe;UI.renderSowChoices();return}
  if(b.hasAttribute("data-sow")){if(compact())UI.openSow();else $("#capText").focus();return}
  if(b.id==="logoBtn"){UI.showToday();return}
  if(b.dataset.open){UI.open(b.dataset.open);return}
  if(b.dataset.tab){UI.tab=b.dataset.tab;lsSet("novale.tab",UI.tab);if(compact()&&$("#detail").classList.contains("open")){UI.openId=null;$("#detail").classList.remove("open")}UI.render();$("#list").scrollTop=0;return}
  if(b.dataset.filt){UI.filt[UI.tab]=b.dataset.filt;UI.render();$("#list").scrollTop=0;return}
  if(b.dataset.goto){const [tb,f]=b.dataset.goto.split(":");UI.tab=tb;if(UI.filt[tb])UI.filt[tb]=f;UI.render();return}
  if(b.dataset.sub){UI.sub=b.dataset.sub;UI.showForm=null;UI.renderSheet(true);return}
  if(b.hasAttribute("data-close")){UI.close();return}
  if(b.hasAttribute("data-x")){b.closest("dialog").close();return}
  if(b.hasAttribute("data-migrate")){(UI._migrate||[]).forEach(i=>Store.put(i,{now:true}));UI._migrate=null;UI.render();toast(t("t_migrated"));return}
  const i=Store.get(UI.openId);
  if(b.dataset.prev){$("#fPrevue").value=addDays(today(),+b.dataset.prev);return}
  if(b.dataset.prevm){$("#fPrevue").value=addMonths(today(),+b.dataset.prevm);return}
  if(b.dataset.env&&i){i.envie=+b.dataset.env;Store.put(i);UI.renderSheet(true);UI.render();return}
  if(b.dataset.envr&&i){i._er=+b.dataset.envr;UI.renderSheet(true);return}
  if(b.dataset.link&&i){const id=b.dataset.link;i.liens=i.liens.includes(id)?i.liens.filter(x=>x!==id):[...i.liens,id];b.setAttribute("aria-pressed",String(i.liens.includes(id)));Store.put(i);return}
  if(b.dataset.act){UI.act(b.dataset.act);return}
});
document.addEventListener("keydown",e=>{
  const tl=e.target.closest&&e.target.closest('[role="tablist"]');
  if(tl&&(e.key==="ArrowRight"||e.key==="ArrowLeft"||e.key==="Home"||e.key==="End")){const tabs=[...tl.querySelectorAll('[role="tab"]')];let k=tabs.indexOf(e.target);if(k<0)return;e.preventDefault();k=e.key==="Home"?0:e.key==="End"?tabs.length-1:(k+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;const id=tabs[k].dataset.tab||tabs[k].dataset.sub,attr=tabs[k].dataset.tab?"data-tab":"data-sub";tabs[k].click();document.querySelector(`[role="tablist"] [${attr}="${id}"]`)?.focus();return}
  if(e.key==="Escape"){const o=$("#options");if(!o.hidden){o.hidden=true;$("#optBtn").setAttribute("aria-expanded","false");$("#optBtn").focus();if(UI.wipeStep){UI.wipeStep=0;UI.renderWipe()}return}if(!$("#aux").open&&!$("#sowDlg").open&&$("#detail").classList.contains("open"))UI.close();else if(UI.openId&&!$("#aux").open&&!$("#sowDlg").open)UI.close()}});
$("#options").addEventListener("input",e=>{if(e.target.id==="wipeWord"){$("#wipeGo").disabled=e.target.value.trim().toUpperCase()!==t("w_word")}});
$("#filters").addEventListener("input",e=>{if(e.target.id==="search"){UI.renderList();UI.renderFilters()}});
const D=$("#detail");
D.addEventListener("input",e=>{
  const i=Store.get(UI.openId);if(!i)return;const el=e.target,f=el.dataset.f;
  if(f==="titre"||f==="idee"||f==="bilan"){i[f]=el.value;Store.put(i);if(f!=="bilan")UI.renderList()}
  else if(f==="tags"){i.tags=el.value.split(",").map(s=>s.trim().replace(/^#/,"")).filter(Boolean);Store.put(i);UI.renderList()}
  else if(el.dataset.q){i.q[el.dataset.q]=el.value;Store.put(i)}
});
D.addEventListener("change",e=>{
  const el=e.target;if(!el.dataset||!el.dataset.date)return;const i=Store.get(UI.openId);if(!i)return;
  const k=el.dataset.date,v=el.value;
  if(!isD(v)&&k!=="prevue"){el.value=i.dates[k]||"";return toast(t("t_dateReq"))}
  i.dates[k]=isD(v)?v:"";log(i,t("l_date",t("ev_"+k),v));
  Store.put(i,{now:true});UI.render();UI.renderSheet(true);
});
D.addEventListener("focusout",e=>{if(e.target.dataset&&e.target.dataset.q){const i=Store.get(UI.openId);if(!i)return;const tab=D.querySelector('.subtabs [data-sub="questions"]');if(tab)tab.textContent=t("sub_q",ripeness(i));UI.renderList()}});
$("#aux").addEventListener("click",e=>{if(e.target.id==="aux")$("#aux").close()});

function sow(ta,firstDot){
  const v=ta.value.trim();
  if(!v){ta.focus();toast(t("t_wrote"));return false}
  if(!UI.capEnvie){firstDot()?.focus();toast(t("t_desire"));return false}
  const i=newIdea(v,UI.capEnvie);Store.put(i,{now:true});
  ta.value="";UI.capEnvie=0;UI.renderCap();UI.renderSowChoices();UI.tab="jachere";UI.filt.jachere="tout";lsSet("novale.tab","jachere");UI.render();
  toast(t("t_sown",frLong(i.dates.relire)));return true;
}
$("#capture").addEventListener("submit",e=>{e.preventDefault();sow($("#capText"),()=>$("#capDots .dot"))});
$("#sowForm").addEventListener("submit",e=>{e.preventDefault();if(sow($("#sowText"),()=>$("#sowChoices button")))$("#sowDlg").close()});
$("#sowText").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#sowForm").requestSubmit()}});
$("#sowDlg").addEventListener("click",e=>{if(e.target.id==="sowDlg")$("#sowDlg").close()});
$("#optBtn").addEventListener("click",()=>{const o=$("#options"),b=$("#optBtn");o.hidden=!o.hidden;b.setAttribute("aria-expanded",String(!o.hidden));if(o.hidden&&UI.wipeStep){UI.wipeStep=0;UI.renderWipe()}});
$("#setLang").addEventListener("change",e=>{LANG=e.target.value==="en"?"en":"fr";lsSet("novale.lang",LANG);Store.setPrefs({lang:LANG});UI.applyStatic();UI.render();if(UI.openId)UI.renderSheet(true)});
$("#copyAllBtn").addEventListener("click",()=>{const all=Store.all();if(!all.length)return toast(t("t_empty"));copyText(all.map(i=>"<!-- "+fileName(i.titre)+".md -->\n"+toMd(i)).join("\n\n"),t("t_copiedAll",all.length))});
$("#zipBtn").addEventListener("click",async()=>{
  const all=Store.all();if(!all.length)return toast(t("t_empty"));
  try{const JSZip=await loadJSZip();const z=new JSZip();const f=z.folder("Novale");const used=new Set();
    all.forEach(i=>{let n=fileName(i.titre),k=n,c=2;while(used.has(k.toLowerCase()))k=n+" "+c++;used.add(k.toLowerCase());f.file(k+".md",toMd(i))});
    f.file(t("dashFile")+".md",dashboard());f.file(t("tplDir")+"/"+t("tplFile")+".md",template());
    const blob=await z.generateAsync({type:"blob"});if(await save("Novale-"+today()+".zip",blob))toast(t("t_unzip"));
  }catch(e){toast(t("t_zipFail"))}
});
$("#importFile").addEventListener("change",async e=>{const files=[...e.target.files];if(!files.length)return;importMany(await Promise.all(files.map(f=>f.text())));e.target.value=""});
$("#pasteBtn").addEventListener("click",()=>{UI.aux(`<div class="dhead"><span class="pill">${esc(t("pasteTitle"))}</span><button class="close" type="button" data-x aria-label="${esc(t("close"))}">×</button></div><p class="muted" style="margin:0">${esc(t("pasteP"))}</p><div class="copybox"><label for="pasteTa" class="sr">${esc(t("pasteTitle"))}</label><textarea id="pasteTa" placeholder="---&#10;id: …&#10;status: resting&#10;---&#10;# …"></textarea></div><div class="actions"><button class="btn primary small" type="button" id="pasteGo">${esc(t("importBtn"))}</button></div>`);$("#pasteTa").focus()});
$("#auxBody").addEventListener("click",e=>{if(e.target.id==="pasteGo"){const v=$("#pasteTa").value.trim();if(!v)return;importMany(v.replace(/^<!--[^\n]*-->[ \t]*$/gm,"").trim().split(/\n(?=---\nid: )/).map(s=>s.trim()).filter(Boolean));$("#aux").close()}});
$("#blankBtn").addEventListener("click",async()=>{
  if(canSave()){if(await save(t("p_blankFile")+".html",ficheHtml([])))toast(t("t_print"))}
  else copyText(ficheHtml([]),t("t_codeCopied"));
});
$("#setRest").addEventListener("change",e=>{Store.setPrefs({rest:+e.target.value});toast(t("t_restSet",e.target.value))});
$("#setLimit").addEventListener("change",e=>{Store.setPrefs({limit:+e.target.value});UI.render()});
window.matchMedia(COMPACT).addEventListener?.("change",()=>{if(!UI.openId)UI.renderToday();UI.renderAlerts();UI.renderList()});

/* ---------- Démarrage ---------- */
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();UI.installEvt=e;UI.renderInstall()});
window.addEventListener("appinstalled",()=>{UI.installEvt=null;UI.renderInstall()});
function openFromHash(){if(location.hash==="#new"){history.replaceState(null,"",location.pathname+location.search);if(compact())UI.openSow();else $("#capText").focus()}}
window.addEventListener("hashchange",openFromHash);
UI.applyStatic();
UI.render();
Store.init().then(()=>{openFromHash();if(STANDALONE&&navigator.storage&&navigator.storage.persist&&Store.all().length)navigator.storage.persist().catch(()=>{});const p=Store.prefs.lang;if((p==="fr"||p==="en")&&p!==LANG&&!lsGet("novale.lang")){LANG=p;UI.applyStatic();UI.render()}});
(async()=>{try{if(!STANDALONE){downloads=await claude.use("downloads");UI.render()}}catch(e){}})();
})();
</script>

if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
